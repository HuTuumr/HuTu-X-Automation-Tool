<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 14px;
    background: #0f1114; color: #e7e9ea;
    font: 13px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { font-size: 11px; color: #6b7783; margin-bottom: 12px; }
  .box {
    background: #16181c; border: 1px solid #2f3336; border-radius: 10px;
    padding: 10px; margin-bottom: 10px;
  }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 2px 0; }
  .kv span:first-child { color: #8b98a5; }
  .kv span:last-child { color: #e7e9ea; text-align: right; word-break: break-all; }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; border: 1px solid #2f3336; background: #1c1f23; color: #e7e9ea;
    border-radius: 999px; padding: 7px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #2f3336; }
  button.primary { background: #1d9bf0; border-color: #1d9bf0; color: #fff; font-weight: 600; }
  #status { font-size: 11.5px; margin-top: 8px; min-height: 16px; color: #8b98a5; word-break: break-all; }
  #status.ok { color: #00ba7c; }
  #status.err { color: #f4212e; }
  #sw { font-size: 11px; color: #6b7783; margin-top: 4px; }
</style>
</head>
<body>
  <h1>HuTu助手</h1>
  <div class="sub">本地模型 · 人工确认后发送</div>

  <div class="box">
    <div class="kv"><span>接口</span><span id="base">—</span></div>
    <div class="kv"><span>模型</span><span id="model">—</span></div>
    <div class="kv"><span>后台</span><span id="sw">检查中…</span></div>
  </div>

  <div class="row">
    <button id="test" class="primary">测试连接</button>
    <button id="open">打开设置</button>
  </div>
  <div id="status"></div>

<script src="popup.js"></script>
</body>
</html>
